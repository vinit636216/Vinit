# Nginx reverse proxy for the Vinit V Balgum portfolio app.
# Copy to /etc/nginx/sites-available/portfolio.conf on the VPS, then:
#   sudo ln -s /etc/nginx/sites-available/portfolio.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Replace yourdomain.com below with your actual domain before enabling.
# After DNS points at this server, run certbot (see DEPLOY.md) to add HTTPS —
# certbot will rewrite this file to add the SSL server block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
