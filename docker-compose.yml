services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vinit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vinit}
      POSTGRES_DB: ${POSTGRES_DB:-vinit_portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vinit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vinit}:${POSTGRES_PASSWORD:-vinit}@db:5432/${POSTGRES_DB:-vinit_portfolio}?schema=public
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/public/uploads

volumes:
  pgdata:
  uploads:
